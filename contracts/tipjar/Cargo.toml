[package]
name = "tipjar"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
quickcheck = "1.0"
quickcheck_macros = "1.0"
proptest = "1.4"
criterion = "0.5"

# NOTE: the `contract_bench` and `gas_benchmarks` benches were moved to
# benches/disabled/ for the green CI baseline — both use removed Budget testutils
# APIs (cpu_instruction_count/memory_bytes_count) and a non-existent `tip_batch`
# method. `clippy --all-targets` compiles benches, so they must build to keep CI
# green. Restore them alongside the relevant feature work.

# NOTE: 38 integration test suites were moved to tests/disabled/ to establish a
# green CI baseline (they reference contract methods/modules stripped in commit
# 2598eb9). See tests/disabled/README.md. Re-add a [[test]] entry here (or rely on
# auto-discovery) when re-enabling a suite.

[[test]]
name = "quickcheck_properties"
path = "tests/quickcheck_properties.rs"

[[test]]
name = "market_making_tests"
path = "tests/market_making_tests.rs"

[[test]]
name = "partial_pause_tests"
path = "tests/partial_pause_tests.rs"

[[test]]
name = "lending_tests"
path = "tests/lending_tests.rs"

