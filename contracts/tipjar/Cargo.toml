[package]
name = "tipjar"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# `rlib` lets tests/integration depend on this crate as a normal Rust
# library; `cdylib` remains the actual on-chain WASM artifact. Unlike
# contracts/tipjar-v2-fixture, tests/integration builds a native test binary
# rather than a second cdylib, so it isn't subject to the WASM
# symbol-export collision that rules out an rlib dependency there.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
proptest = "1.4"

# `pause_tests` and `partial_pause_tests` live under the repo-root `tests/`
# directory (shared with `tests/common`) rather than `contracts/tipjar/tests/`
# — see `tests/common/mod.rs` for why. Declared here explicitly since Cargo's
# test auto-discovery only looks in this package's own `tests/` directory.
[[test]]
name = "pause_tests"
path = "../../tests/pause_tests.rs"

[[test]]
name = "partial_pause_tests"
path = "../../tests/partial_pause_tests.rs"

[[test]]
name = "gas_benchmarks"
path = "../../tests/gas/benchmarks.rs"
