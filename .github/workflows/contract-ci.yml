name: Contract CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build v2 upgrade test fixture (WASM)
        # contracts/tipjar/src/test_upgrade.rs embeds this via
        # soroban_sdk::contractimport! at compile time, so it must exist on
        # disk before `cargo clippy --all-targets` or `cargo test -p tipjar`
        # can compile that file.
        run: cargo build -p tipjar-v2-fixture --target wasm32v1-none --release

      - name: Verify pause_tests / partial_pause_tests wiring
        # Guard against the orphaned-test-tree failure mode: confirm the two
        # root-level integration tests are still registered as real [[test]]
        # targets of the `tipjar` package (see tests/README.md).
        run: cargo test -p tipjar --test pause_tests --test partial_pause_tests -- --list

      - name: Run tests
        run: cargo test -p tipjar

      - name: Build WASM
        run: cargo build -p tipjar --target wasm32v1-none --release

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Verify generated contract client is current
        run: scripts/check-contract-client-drift.sh target/wasm32v1-none/release/tipjar.wasm

      - name: Generate coverage
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin -p tipjar --out Xml --output-dir coverage/ --timeout 120

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  # tipjar-legacy is excluded from the default workspace build (see root
  # Cargo.toml) so the production-contract jobs above never pay its compile-time
  # cost.  This separate job builds and tests it explicitly, ensuring that
  # `simulator` and `tools/gas-estimator` — which depend on it via path — remain
  # in a working state.
  simulator-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check tipjar-legacy formatting
        # Run fmt check inside the legacy workspace; it has its own [workspace]
        # table so `cargo fmt` will not traverse the root workspace.
        run: cargo fmt --manifest-path contracts/tipjar-legacy/Cargo.toml -- --check

      - name: Build tipjar-legacy (standalone)
        # Builds the legacy fixture in its own workspace, confirming it still
        # compiles independently of the root workspace.
        run: cargo build --manifest-path contracts/tipjar-legacy/Cargo.toml

      - name: Build simulator
        run: cargo build -p tipjar-simulator

      - name: Test simulator
        run: cargo test -p tipjar-simulator

      - name: Build gas-estimator
        run: cargo build -p gas-estimator

      - name: Test gas-estimator
        run: cargo test -p gas-estimator

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
