name: Gas Regression Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gas-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build contract (WASM)
        run: cargo build -p tipjar --target wasm32v1-none --release

      - name: Build v2 upgrade test fixture (WASM)
        # contracts/tipjar/src/test_upgrade.rs and tests/gas/benchmarks.rs
        # (bench_propose_upgrade / bench_execute_upgrade) both embed this via
        # soroban_sdk::contractimport! at compile time, so it must exist on
        # disk before `cargo test -p tipjar` (which the gas profiler runs
        # under the hood) can compile.
        run: cargo build -p tipjar-v2-fixture --target wasm32v1-none --release

      # Run benchmarks on the current branch and save the report
      - name: Profile gas (current)
        run: bash scripts/profile-gas.sh

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report-${{ github.sha }}
          path: gas-report.json

      # On PRs, fetch the baseline from main and compare
      - name: Download baseline report (main)
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: gas-check.yml
          branch: main
          name: gas-report-${{ github.event.pull_request.base.sha }}
          path: baseline/
        continue-on-error: true   # no baseline on first run

      - name: Compare against baseline
        if: github.event_name == 'pull_request' && hashFiles('baseline/gas-report.json') != ''
        run: |
          bash scripts/profile-gas.sh --baseline baseline/gas-report.json
